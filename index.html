 {id:'sich',year:'XVI–XVIII ст.',title:'Козацька Січ',icon:'⚔️',artifact:'Ключ відваги',gem:'🗝️',scene:'Ти опиняєшся біля укріпленої козацької Січі. За дерев’яними валами чути голоси товариства. Вартовий пропускає лише тих, хто розуміє, що свобода неможлива без спільної відповідальності.',quote:'«Воля починається там, де є гідність і відповідальність».',question:'Як називали збори, на яких козаки спільно вирішували важливі справи?',type:'choice',options:['Козацька рада','Королівський двір','Міська ратуша','Шкільна громада'],correct:0,hint:'Це слово означає спільне обговорення та ухвалення рішень.',explain:'Так! Козацька рада була важливою формою колективного ухвалення рішень у Запорозькій Січі.',fact:'Правильна відповідь — козацька рада. Це була важлива форма колективного ухвалення рішень у Запорозькій Січі.'},
 {id:'orlyk',year:'1710',title:'Закон і воля',icon:'⚖️',artifact:'Терези справедливості',gem:'⚖️',scene:'Ти потрапляєш до табору козацької старшини в Бендерах. Після поразки під Полтавою козаки обирають нового гетьмана й складають документ, що має обмежити владу правителя та захистити права війська.',quote:'«Влада, обмежена законом, — запорука свободи».',question:'Як називають документ 1710 року, який вважають однією з перших конституцій у Європі?',type:'choice',options:['Руська правда','Литовський статут','Конституція Пилипа Орлика','Магдебурзьке право'],correct:2,hint:'Документ названо на честь гетьмана, обраного після смерті Івана Мазепи.',explain:'Вірно! Конституцію Пилипа Орлика ухвалили 5 квітня 1710 року в Бендерах. Документ передбачав поділ влади й обмеження повноважень гетьмана.',fact:'Правильна відповідь — Конституція Пилипа Орлика (5 квітня 1710 року). Вона передбачала поділ влади й обмеження повноважень гетьмана.'},
 {id:'kobzar',year:'1840',title:'Слово, що будить',icon:'✒️',artifact:'Перо Кобзаря',gem:'✒️',scene:'Петербург, 1840 рік. У друкарні щойно вийшла невелика книжка українських віршів. Згодом її читатимуть у кожній хаті, а слова поета стануть голосом народу, який мріє про волю.',quote:'«Слово може бути сильнішим за кайдани».',question:'Хто автор поетичної збірки «Кобзар», уперше виданої 1840 року?',type:'choice',options:['Іван Котляревський','Тарас Шевченко','Леся Українка','Іван Франко'],correct:1,hint:'Цей поет народився 1814 року в селі Моринці на Черкащині.',explain:'Так! «Кобзар» Тараса Шевченка вперше вийшов 1840 року. Його поезія стала символом боротьби українців за свободу й гідність.',fact:'Правильна відповідь — Тарас Шевченко. «Кобзар» уперше вийшов 1840 року, а його поезія стала символом боротьби за свободу.'},
 {id:'unr',year:'1917–1918',title:'Шлях державності',icon:'📜',artifact:'Сувій єдності',gem:'📜',scene:'Ти відкриваєш старовинний архів. Серед документів — універсали Центральної Ради. Один із них став визначним кроком до проголошення незалежної Української Народної Республіки.',quote:'«Майбутнє держави народжується з права народу обирати власний шлях».',question:'Яким Універсалом Центральна Рада проголосила незалежність УНР у січні 1918 року?',type:'choice',options:['Першим','Другим','Третім','Четвертим'],correct:3,hint:'Це останній із чотирьох Універсалів Центральної Ради.',explain:'Вірно! IV Універсал, ухвалений 22 січня 1918 року (за новим стилем), проголосив самостійність УНР.',fact:'Правильна відповідь — IV Універсал. Він проголосив самостійність УНР 22 січня 1918 року (за новим стилем).'},
 {id:'zluka',year:'1919',title:'Софійська площа',icon:'🤝',artifact:'Знак соборності',gem:'🤝',scene:'Морозний січневий день. Софійська площа в Києві заповнена людьми, над натовпом майорять прапори. Сьогодні українські землі, розділені кордонами, мають стати єдиним цілим.',quote:'«Сила народу — в його єдності».',question:'Що проголосили 22 січня 1919 року на Софійській площі в Києві?',type:'choice',options:['Створення Гетьманату','Скликання Центральної Ради','Перенесення столиці до Харкова','Об’єднання УНР і ЗУНР в одну державу'],correct:3,hint:'Цю подію щороку відзначають як День Соборності України.',explain:'Саме так! 22 січня 1919 року проголосили Акт Злуки — об’єднання Української Народної Республіки та Західноукраїнської Народної Республіки. Цей день відзначають як День Соборності України.',fact:'Правильна відповідь — об’єднання УНР і ЗУНР в одну державу (Акт Злуки). 22 січня відзначають як День Соборності України.'},
 {id:'helsinki',year:'1976',title:'Голос правди',icon:'🛡️',artifact:'Щит правди',gem:'🛡️',scene:'Київ, середина 1970-х. Говорити вголос про права людини небезпечно, але група сміливців вирішує збирати свідчення про порушення прав і розповідати про них світові.',quote:'«Права людини не мають кордонів».',question:'Як називалася правозахисна організація, створена в Києві 1976 року?',type:'choice',options:['Кирило-Мефодіївське братство','Українська Гельсінська група','Товариство «Просвіта»','Народний Рух України'],correct:1,hint:'Назва пов’язана з містом, де 1975 року підписали міжнародний Заключний акт про безпеку та права людини.',explain:'Правильно! Українську Гельсінську групу створили 9 листопада 1976 року в Києві на чолі з письменником Миколою Руденком. Багатьох її учасників переслідувала радянська влада.',fact:'Правильна відповідь — Українська Гельсінська група. Її створили 9 листопада 1976 року в Києві на чолі з Миколою Руденком.'},

const N=LEVELS.length,MAX=N*100;
const pad=n=>String(n).padStart(2,'0');

const RESULTS_URL='https://script.google.com/macros/s/AKfycbzKlpiSy5KL7UEgd-cIw79QzuwonsMnDLtZ-ibq8JD2iY3ArD9cJ8EfhB6B3QDKpalX8Q/exec';

const STORAGE='quest_svoboda_v3';
const EMPTY=()=>({level:0,answers:{},hints:{},started:false,student:null,sid:'',seq:0,startedAt:0,finishedAt:0,outbox:{}});
let state=load();let soundOn=false,ctx=null,syncStatus=RESULTS_URL?'idle':'off',syncing=false,retryTimer=null,picked=null;
function cleanStr(v,max){return typeof v==='string'?v.replace(/\s+/g,' ').trim().slice(0,max):''}
function load(){const base=EMPTY();try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!x||typeof x!=='object')return base;
 const st=x.student&&typeof x.student==='object'?{last:cleanStr(x.student.last,40),first:cleanStr(x.student.first,40),group:cleanStr(x.student.group,20),year:cleanStr(String(x.student.year||''),4),faculty:cleanStr(x.student.faculty,80)}:null;
 const student=st&&st.last&&st.first?st:null;
 const answers={};if(x.answers&&typeof x.answers==='object')for(const l of LEVELS){const a=x.answers[l.id];if(a&&typeof a==='object'){const ok=!!a.ok;answers[l.id]={ok,pts:ok?(Number(a.pts)===75?75:100):0,v:cleanStr(String(a.v==null?'':a.v),70),i:Number.isInteger(a.i)?a.i:-1}}}
 const hints={};if(x.hints&&typeof x.hints==='object')for(const l of LEVELS)if(x.hints[l.id])hints[l.id]=true;
 let first=LEVELS.findIndex(l=>!answers[l.id]);if(first<0)first=N;
 const level=Number.isInteger(x.level)?Math.max(0,Math.min(first,x.level)):0;
 return Object.assign(base,{level,answers,hints,started:!!x.started&&!!student,student,sid:typeof x.sid==='string'?x.sid.slice(0,40):'',seq:Number(x.seq)||0,startedAt:Number(x.startedAt)||0,finishedAt:Number(x.finishedAt)||0,outbox:x.outbox&&typeof x.outbox==='object'&&!Array.isArray(x.outbox)?x.outbox:{}})}catch(e){}return base}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2700)}
function sound(f=600){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.055,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.17);o.start();o.stop(ctx.currentTime+.18)}catch(e){}}
function app(html,keep){document.getElementById('app').innerHTML=html;if(!keep)window.scrollTo({top:0,behavior:'smooth'})}
function score(){return Object.values(state.answers).reduce((s,a)=>s+a.pts,0)}
function countOk(){return Object.values(state.answers).filter(a=>a.ok).length}
function countWrong(){return Object.values(state.answers).filter(a=>!a.ok).length}
function fullName(){const s=state.student;return s?`${s.first} ${s.last}`:''}
function studentLine(){const s=state.student;return s?`${escapeHTML(s.last)} ${escapeHTML(s.first)} · ${escapeHTML(s.group)} · вступ ${escapeHTML(s.year)}`:''}
function newId(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}return 'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}

// ----- Облік результатів -----
function payload(){const s=state.student||{},a=state.answers;const end=state.finishedAt||Date.now();return {sid:state.sid,seq:++state.seq,lastName:s.last||'',firstName:s.first||'',group:s.group||'',year:s.year||'',faculty:s.faculty||'',status:state.finishedAt?'Завершено':'В процесі',score:score(),max:MAX,correct:countOk(),mistakes:countWrong(),hints:LEVELS.filter(l=>state.hints[l.id]).length,levels:LEVELS.map(l=>a[l.id]?a[l.id].pts:''),answers:LEVELS.map((l,i)=>a[l.id]?`${i+1}) ${a[l.id].v} ${a[l.id].ok?'✓':'✗'}`:'').filter(Boolean).join('; '),startedAt:state.startedAt?new Date(state.startedAt).toISOString():'',finishedAt:state.finishedAt?new Date(state.finishedAt).toISOString():'',durationMin:state.startedAt?Math.round((end-state.startedAt)/600)/100:''}}
function pending(){return Object.values(state.outbox||{})}
function queueSync(){if(!state.sid)return;state.outbox=state.outbox||{};state.outbox[state.sid]=payload();save();flush()}
function setSync(s){syncStatus=s;const el=document.getElementById('syncStatus');if(el)el.outerHTML=syncHTML()}
function syncHTML(){const m={off:['⚠','Облік не налаштовано: результат збережено лише в цьому браузері.','warn'],idle:['☁','Результат збережено.','ok'],ok:['☁','Результат надіслано організаторам.','ok'],sending:['⟳','Надсилаємо результат…','wait'],error:['⚠','Немає зв’язку з сервером. Спробуємо ще раз автоматично — не закривай сторінку.','warn']}[pending().length&&syncStatus==='idle'?'sending':syncStatus]||['','',''];return `<div id="syncStatus" class="sync ${m[2]}" role="status">${m[0]} ${m[1]}${syncStatus==='error'?' <button class="link-btn" id="syncRetry" type="button">Повторити зараз</button>':''}</div>`}
async function flush(){if(!RESULTS_URL){setSync('off');return}if(syncing||!pending().length)return;syncing=true;clearTimeout(retryTimer);setSync('sending');try{for(const p of pending()){const r=await fetch(RESULTS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});let ok=r.ok;try{const j=await r.json();if(j&&j.ok===false)ok=false}catch(e){}if(!ok)throw new Error('bad response');const cur=state.outbox[p.sid];if(cur&&cur.seq===p.seq){delete state.outbox[p.sid];save()}}syncing=false;if(pending().length)return flush();setSync('ok')}catch(e){syncing=false;setSync('error');retryTimer=setTimeout(flush,20000)}}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='syncRetry')flush()});
window.addEventListener('online',flush);

// ----- Екрани -----
function mapCards(){return LEVELS.map((l,i)=>{const a=state.answers[l.id];const cls=a?(a.ok?'done':'miss'):(state.started&&i===state.level?'current':'');return `<div class="map-card ${cls}"><span class="num">${pad(i+1)} / ${pad(N)}</span><span class="symbol" aria-hidden="true">${l.icon}</span><div class="mtitle">${l.title}</div><div class="msub">${a?(a.ok?`✓ ${a.pts} балів`:'✗ 0 балів'):l.year}</div></div>`}).join('')}
function landing(){const finished=state.started&&state.level>=N;app(`<section class="hero fade"><div><div class="eyebrow"><span class="flag-chip" aria-hidden="true"></span>Пригодницький історичний квест</div><h1>У пошуках <span>свободи</span></h1><p class="lede">Пройди крізь десять епох української історії. Розгадай таємниці, збери символи волі й відкрий фінальну відзнаку. На кожне питання — лише одна спроба, тож обирай уважно.</p><div class="btn-row"><button class="btn" id="startBtn">${finished?'🏆 Мій результат':state.started?'▶ Продовжити подорож':'✦ Розпочати пригоду'}</button></div>${state.student?`<div class="player"><span>👤 ${studentLine()}</span><button class="link-btn" id="switchBtn" type="button">Це не я</button></div>`:''}<div class="stats"><div class="stat"><strong>${pad(N)}</strong><small>Історичних розділів</small></div><div class="stat"><strong>100</strong><small>Балів за розділ</small></div><div class="stat"><strong>1</strong><small>Спроба на кожне питання</small></div></div></div><div class="hero-art" aria-label="Стилізований золотий компас свободи" role="img"><div class="orb"><svg viewBox="0 0 200 200" fill="none" aria-hidden="true"><circle cx="100" cy="100" r="73" stroke="#5b9bff" stroke-width="1.5" opacity=".85"/><circle cx="100" cy="100" r="54" stroke="#f3c775" stroke-width="1" opacity=".45"/><path d="M100 13L112 88L187 100L112 112L100 187L88 112L13 100L88 88Z" fill="#f3c775" opacity=".86"/><path d="M100 43L108 92L157 100L108 108L100 157L92 108L43 100L92 92Z" fill="#fbe8b6"/><circle cx="100" cy="100" r="10" fill="#1a3045" stroke="#f3c775" stroke-width="3"/></svg></div><div class="art-label">ЗНАЙДИ СВІЙ ШЛЯХ ✦</div></div></section><section style="margin-top:30px"><div class="section-head"><h2>Мапа подорожі</h2><span class="tiny">${N} епох · ${N} символів</span></div><div class="map-grid">${mapCards()}</div></section>`);document.getElementById('startBtn').onclick=startQuest;if(document.getElementById('switchBtn'))document.getElementById('switchBtn').onclick=switchPlayer}
function startQuest(){if(state.started)return render();if(!state.student)return registration();beginAttempt();render()}
function beginAttempt(){state.started=true;state.sid=newId();state.startedAt=Date.now();state.finishedAt=0;save();queueSync()}
function registration(){const now=new Date().getFullYear();const years=Array.from({length:7},(_,i)=>now-i);const s=state.student||{};app(`<section class="reg fade"><div class="main-card"><div class="eyebrow"><span class="flag-chip" aria-hidden="true"></span>Реєстрація учасника</div><h1 class="chapter-title">Перш ніж вирушити в дорогу</h1><p class="story">Вкажи свої дані, щоб організатори побачили твій результат і зарахували бали.</p><form id="regForm" novalidate><div class="field-grid"><label class="field"><span>Прізвище *</span><input name="last" autocomplete="family-name" maxlength="40" value="${escapeHTML(s.last||'')}" required></label><label class="field"><span>Ім’я *</span><input name="first" autocomplete="given-name" maxlength="40" value="${escapeHTML(s.first||'')}" required></label><label class="field"><span>Група *</span><input name="group" maxlength="20" placeholder="Напр.: КН-24-1" value="${escapeHTML(s.group||'')}" required></label><label class="field"><span>Рік вступу *</span><select name="year" required><option value="">Обери рік</option>${years.map(y=>`<option ${String(y)===s.year?'selected':''}>${y}</option>`).join('')}</select></label><label class="field wide"><span>Факультет / спеціальність</span><input name="faculty" maxlength="80" placeholder="Необов’язково" value="${escapeHTML(s.faculty||'')}"></label></div><div id="regError" class="feedback bad hidden" role="alert"></div><p class="tiny" style="margin-top:16px">Дані використовуються лише для обліку результатів квесту. На кожне питання квесту — одна спроба.</p><div class="btn-row"><button class="btn" type="submit">Почати квест →</button><button class="btn secondary" type="button" id="regBack">← Назад</button></div></form></div></section>`);
const f=document.getElementById('regForm');f.elements.last.focus();document.getElementById('regBack').onclick=landing;f.onsubmit=e=>{e.preventDefault();const v=k=>cleanStr(f.elements[k].value,k==='faculty'?80:k==='group'?20:40);const d={last:v('last'),first:v('first'),group:v('group').toUpperCase(),year:f.elements.year.value,faculty:v('faculty')};const nameOk=x=>/^[A-Za-zА-Яа-яІіЇїЄєҐґ’ʼ'\- ]{2,40}$/.test(x);const errs=[];if(!nameOk(d.last))errs.push('прізвище');if(!nameOk(d.first))errs.push('ім’я');if(d.group.length<2)errs.push('групу');if(!/^\d{4}$/.test(d.year))errs.push('рік вступу');const box=document.getElementById('regError');if(errs.length){box.textContent='Перевір, будь ласка: '+errs.join(', ')+'.';box.classList.remove('hidden');return}state.student=d;beginAttempt();render()}}
function switchPlayer(){if(!confirm('Змінити учасника? Прогрес на цьому пристрої буде скинуто. Уже надіслані результати залишаться в таблиці.'))return;state=Object.assign(EMPTY(),{outbox:state.outbox,seq:state.seq});picked=null;save();registration()}
function render(){if(!state.started)return landing();if(state.level>=N)return finale();game()}
function game(keep){const l=LEVELS[state.level],a=state.answers[l.id],index=state.level,hint=!!state.hints[l.id];
const answerBox=l.type==='choice'?`<div class="options" role="radiogroup" aria-label="Варіанти відповіді">${l.options.map((o,i)=>{let c='';if(a){if(i===l.correct)c='correct';else if(i===a.i)c='wrong'}else if(picked===i)c='selected';return `<button class="option ${c}" type="button" data-index="${i}" role="radio" aria-checked="${a?i===a.i:picked===i}" ${a?'disabled':''}><span class="circle">${'АБВГДЕ'[i]}</span><span>${o}</span></button>`}).join('')}</div>${a?'':`<div class="next-row"><button class="btn" id="confirmBtn" type="button" ${picked===null?'disabled':''}>Підтвердити відповідь →</button></div><p class="rule-note">Відповідь можна дати лише один раз — змінити її потім не вийде.</p>`}`
:`<form class="answer-form" id="answerForm"><input id="answerInput" aria-label="Введіть відповідь" placeholder="${l.placeholder}" autocomplete="off" spellcheck="false" maxlength="70" ${a?`disabled value="${escapeHTML(a.v)}"`:''}><button class="btn" type="submit" ${a?'disabled':''}>Відповісти →</button></form>${a?'':'<p class="rule-note">Відповідь можна дати лише один раз — перевір написання перед надсиланням.</p>'}`;
const fb=a?(a.ok?`<div class="feedback good">✅ ${l.explain}<br><strong>Отримано: ${a.pts} балів · ${l.artifact} ${l.gem}</strong></div>`:`<div class="feedback bad">❌ Неправильно — за цей розділ 0 балів.<br>${l.fact}</div>`):'';
app(`<div class="fade"><div class="game-head"><div><div class="crumb">Твоя подорож крізь час</div><h2 style="margin:9px 0 0;font-size:17px">Розділ ${index+1} із ${N} · ${l.year}</h2><div class="tiny" style="margin-top:6px">👤 ${studentLine()}</div></div><div class="score">✦ ${score()} / ${MAX} балів</div></div><div class="progress" role="progressbar" aria-label="Прогрес квесту" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${index+(a?1:0)}"><span style="width:${(index+(a?1:0))/N*100}%"></span></div><div class="game-layout"><section class="main-card"><div class="chapter-badge">${l.icon} &nbsp; Історія ${pad(index+1)}</div><h1 class="chapter-title">${l.title}</h1><div class="story"><p>${l.scene}</p><div class="quote">${l.quote}</div></div><div class="question"><div class="qtype">${l.type==='choice'?'Випробування · Обери відповідь':'Випробування · Розгадай шифр'}</div><h3>${l.question}</h3><div id="answerBox">${answerBox}</div><div id="feedback" aria-live="polite">${fb}</div><div class="next-row" id="nextRow">${a?`<button class="btn" id="nextBtn">${index===N-1?'Відкрити фінал ✦':'Наступний розділ →'}</button>`:''}</div></div></section><aside class="side-card"><h3>✦ Твоя колекція</h3><div class="item-list">${LEVELS.map(x=>{const ax=state.answers[x.id];return `<div class="item"><span class="gem">${ax?(ax.ok?x.gem:'✖️'):'🔒'}</span><span style="color:${ax&&ax.ok?'var(--ink)':'var(--muted)'}">${ax?(ax.ok?x.artifact:'Символ не здобуто'):'Невідкритий символ'}</span></div>`}).join('')}</div><div class="divider"></div><h3>💡 Потрібна підказка?</h3><p>Можна скористатися підказкою, але за правильну відповідь отримаєш 75 балів замість 100.</p><button class="small-btn" id="hintBtn" ${a||hint?'disabled':''}>Показати підказку (−25)</button><div id="hintBox">${hint?`<div class="hint">${l.hint}</div>`:''}</div><div class="divider"></div><p>Відповідь зараховується з першої спроби — змінити її не можна.</p>${syncHTML()}</aside></div></div>`,keep);
if(!a){if(l.type==='choice'){document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{picked=Number(b.dataset.index);document.querySelectorAll('.option').forEach(o=>{const on=Number(o.dataset.index)===picked;o.classList.toggle('selected',on);o.setAttribute('aria-checked',String(on))});document.getElementById('confirmBtn').disabled=false});document.getElementById('confirmBtn').onclick=()=>{if(picked!==null)check(picked)}}else{document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();const inp=document.getElementById('answerInput');if(!inp.value.trim()){toast('Спершу введи відповідь');inp.focus();return}check(inp.value)}}}
document.getElementById('hintBtn').onclick=()=>{if(state.answers[l.id]||state.hints[l.id])return;state.hints[l.id]=true;save();document.getElementById('hintBox').innerHTML=`<div class="hint">${l.hint}</div>`;document.getElementById('hintBtn').disabled=true;toast('Підказку відкрито');queueSync()};
const next=document.getElementById('nextBtn');if(next)next.onclick=nextLevel;
if(keep){const f=document.getElementById('feedback');if(f&&f.scrollIntoView)f.scrollIntoView({block:'center',behavior:'smooth'})}}
function normalize(s){return String(s).toLocaleLowerCase('uk-UA').trim().replace(/\s+/g,' ').replace(/[’'ʼ]/g,'').replace(/[.!?]+$/,'')}
function check(value){const l=LEVELS[state.level];if(!l||state.answers[l.id])return;const ok=l.type==='choice'?value===l.correct:l.answers.map(normalize).includes(normalize(value));const pts=ok?(state.hints[l.id]?75:100):0;state.answers[l.id]={ok,pts,v:l.type==='choice'?l.options[value]:cleanStr(String(value),70),i:l.type==='choice'?value:-1};picked=null;save();queueSync();if(ok){sound(760);setTimeout(()=>sound(940),95);toast('Символ свободи знайдено!')}else{sound(240);toast('Відповідь зафіксовано')}game(true)}
function nextLevel(){const l=LEVELS[state.level];if(l&&!state.answers[l.id])return;picked=null;state.level=Math.min(N,state.level+1);if(state.level>=N&&!state.finishedAt){state.finishedAt=Date.now();save();queueSync()}save();render()}
function finale(){const s=state.student||{};const ok=countOk();const mins=state.startedAt&&state.finishedAt?Math.max(1,Math.round((state.finishedAt-state.startedAt)/60000)):0;app(`<section class="finish fade"><div class="eyebrow"><span class="flag-chip" aria-hidden="true"></span>Зібрано ${ok} із ${N} символів свободи</div><span class="big" aria-hidden="true">🏆</span><h1>Ти знайшов <span style="color:var(--gold)">свободу!</span></h1><p>Подорож завершена, але її головна думка залишається з тобою: свободу підтримують пам’ять, знання, гідність, взаємодопомога та щоденна відповідальність.</p><div class="certificate" id="certificate"><div class="seal">💙 🕊️ 💛</div><div class="eyebrow">Іменна відзнака</div><h2>ХРАНИТЕЛЬ ВОЛІ</h2><p>Цю відзнаку отримує</p><div style="font-size:23px;font-weight:700;margin:14px 0 4px;color:var(--gold2)">${escapeHTML(fullName()||'Мандрівник свободи')}</div><div class="tiny">${s.group?`Група ${escapeHTML(s.group)} · рік вступу ${escapeHTML(s.year)}`:''}</div><p>за проходження історичного онлайн-квесту<br><strong>«У пошуках свободи»</strong></p><div class="cert-score">${score()} / ${MAX}</div><div class="tiny">Правильних відповідей: ${ok} із ${N}${mins?` · ${mins} хв`:''}</div></div><div class="breakdown">${LEVELS.map((l,i)=>{const a=state.answers[l.id];return `<div class="${a&&a.ok?'ok':'no'}"><span>${pad(i+1)} · ${l.title}</span><b>${a?(a.ok?`✓ ${a.pts}`:'✗ 0'):'—'}</b></div>`}).join('')}</div>${syncHTML()}<div class="btn-row" style="justify-content:center"><button class="btn" id="printBtn">⎙ Зберегти відзнаку в PDF</button><button class="btn secondary" id="shareBtn">↗ Поділитися результатом</button></div><div class="tiny" style="margin-top:20px">Для PDF натисни кнопку й обери «Зберегти як PDF» у вікні друку.</div></section>`);document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('shareBtn').onclick=async()=>{const msg=`Я пройшов/пройшла онлайн-квест «У пошуках свободи» та набрав/набрала ${score()} із ${MAX} балів!`;try{if(navigator.share)await navigator.share({title:'У пошуках свободи',text:msg,url:location.protocol.startsWith('http')?location.href:undefined});else if(navigator.clipboard){await navigator.clipboard.writeText(msg+(location.protocol.startsWith('http')?' '+location.href:''));toast('Результат скопійовано!')}else toast(msg)}catch(e){if(e.name!=='AbortError')toast('Не вдалося поділитися')}}}
document.getElementById('homeBtn').onclick=landing;document.getElementById('soundBtn').onclick=()=>{soundOn=!soundOn;const b=document.getElementById('soundBtn');b.textContent=soundOn?'♫ Звук: увімк.':'♫ Звук: вимк.';b.setAttribute('aria-pressed',String(soundOn));sound(650)};
render();flush();
</script>
</body>
</html>
